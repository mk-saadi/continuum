# Builds Continuum desktop installers for Linux, macOS and Windows.
#
# Triggers:
#   - push to main or any v* tag -> builds all platform/arch combos in parallel
#   - pull requests (build validation only)
#   - manual dispatch from the Actions tab
#
# On a v* tag push, installers are published as a GitHub Release.
# Otherwise artifacts are attached to the run for download.
#
# Optional code signing (leave the secrets unset to build unsigned):
#   MAC_CSC_LINK / CSC_KEY_PASSWORD      - macOS Developer ID certificate (.p12 base64) + password
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD  - Windows certificate (.pfx base64) + password

name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # required to publish GitHub Releases on tag pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Node 22 LTS satisfies engines >=20.0.0, pdf-parse / playwright-core constraints,
      # and supports require() of ESM modules needed by electron-builder's @noble/hashes v2 dependency
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall hook rebuilds native modules (better-sqlite3) for this platform's Electron ABI
      - name: Install dependencies
        run: npm ci

      - name: Build installer (${{ matrix.platform }} / ${{ matrix.arch }})
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }} --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
